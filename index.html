<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prática Guiada</title>
<meta name="theme-color" content="#2B2927">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de celular; a faixa da semana escolhe a rotina,
   a lista numerada é a ordem do treino, o diagrama do braço é a peça central. */
:root{
  color-scheme:dark;
  --bg:#2B2927; --surface:#383532; --ink:#EDE7DC; --muted:#ADA498;
  --line:#4D4843; --accent:#F0A070; --accent-ink:#2B1A10;
  --root:#F4C95D; --root-ink:#2B2000; --good:#93C9A5;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{min-height:100%;max-width:520px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-direction:column;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;margin:0;line-height:1.1}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat.new{border-style:dashed}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 7px;border-radius:12px;background:var(--surface);border:1.5px solid transparent}
.day .d{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .t{font-family:var(--display);font-weight:700;font-size:15px}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.day.today .dot{background:var(--root)}
.day[aria-pressed="true"]{border-color:var(--accent)}
.day[aria-pressed="true"] .d{color:var(--accent)}

.routine{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.routine h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0;line-height:1.15;text-wrap:balance}
.routine p.sum{margin:0;color:var(--muted);font-size:15px}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:3px;transition:width .25s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.reset{font-size:13px;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px}

ol.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ex{background:var(--surface);border-radius:14px;border:1.5px solid transparent}
.ex.open{border-color:var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:14px 12px}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted)}
.ex.done .check{background:var(--good);border-color:var(--good);color:var(--bg)}
.head{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:8px}
.head .txt{flex:1;min-width:0}
.name{display:block;font-weight:600;font-size:16px;line-height:1.25}
.ex.done .name{color:var(--muted);text-decoration:line-through}
.meta{display:block;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.chev{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}

.detail{padding:2px 12px 14px;display:flex;flex-direction:column;gap:12px}
.fig{background:var(--bg);border-radius:10px;padding:10px;overflow-x:auto}
.fig svg{display:block;flex:none}
.fig pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.legend .r{background:var(--root)} .legend .n{background:var(--ink)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:15px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1.5px solid var(--line);color:var(--ink)}

.empty{background:var(--surface);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:6px}
.empty h2{font-family:var(--display);font-size:20px;margin:0}
.empty p{margin:0;color:var(--muted);font-size:15px}
.doneMsg{background:var(--surface);border-left:4px solid var(--good);border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px}

/* braço da guitarra */
.fb .str{stroke:var(--muted);stroke-width:1.2}
.fb .fret{stroke:var(--line);stroke-width:2}
.fb .lbl{fill:var(--muted);font:600 11px var(--mono)}
.fb .num{fill:var(--muted);font:600 11px var(--mono)}
.fb .num.in{fill:var(--ink)}
.fb .note{fill:var(--ink)}
.fb .note.root{fill:var(--root)}
.fb .nt{fill:var(--bg);font:700 11px var(--body)}
.fb .nt.root{fill:var(--root-ink)}
.fb .inlay{fill:var(--line)}

.back{align-self:flex-start;font-weight:600;font-size:15px;color:var(--muted);padding:6px 8px 6px 0}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:var(--surface);border-radius:16px;padding:30px 20px;text-align:left;font-family:var(--display);font-weight:700;font-size:24px;display:flex;justify-content:space-between;align-items:center}
.dayrow{background:var(--surface);border-radius:14px;padding:16px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;border:1.5px solid transparent}
.dayrow.today{border-color:var(--accent)}
.dayrow.off{background:transparent;border-color:var(--line);border-style:dashed}
.dayrow .dn{font-weight:600;flex:1;display:flex;align-items:center;gap:8px}
.dayrow .rn{color:var(--muted);font-size:14px}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.chev.right{transform:rotate(-90deg)}
.btn.grow{flex:1}
.btn{cursor:pointer}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface)}
.icon svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{aspect-ratio:1;background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:stretch;text-align:left}
.tile svg{flex:1;min-height:0;width:100%}
.tile span{font-family:var(--display);font-weight:700;font-size:19px}
.tile.musica{background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.tile.musculacao{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.daybtn{font-weight:600;font-size:14px;color:var(--accent);padding:8px 14px;border-radius:999px;border:1.5px solid var(--line)}
.setting{background:var(--surface);border-radius:14px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;width:100%}
.setting .st{flex:1}
.setting b{display:block;font-weight:600}
.setting small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sw{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:transform .2s}
.setting[aria-checked="true"] .sw{background:var(--good)}
.setting[aria-checked="true"] .sw::after{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}

.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:6px}
.date{display:flex;align-items:flex-end;gap:10px}
.date .num{font-family:var(--display);font-weight:700;font-size:76px;line-height:.78;letter-spacing:-.04em;color:var(--accent);font-variant-numeric:tabular-nums}
.date .mo{display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.date .mo small{font-weight:500;font-size:14px;letter-spacing:0;text-transform:none;color:var(--muted)}
.ring{flex:none;width:76px;height:76px}
.ring circle{fill:none;stroke-width:6}
.ring .trk{stroke:var(--line)}
.ring .arc{stroke:var(--good);stroke-linecap:round;transition:stroke-dasharray .3s}
.ring text{fill:var(--ink);font:700 17px var(--display);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.ring .arc{transition:none}}
.tl{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.tl .phase{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 0 10px 48px}
.tl .it{display:flex;gap:14px;align-items:stretch}
.tl .rail{flex:none;width:34px;display:flex;flex-direction:column;align-items:center}
.tl .rail::after{content:"";flex:1;width:2px;min-height:14px;background:var(--line);margin:4px 0;border-radius:1px}
.tl .it.done .rail::after{background:var(--good)}
.tl .it:last-child .rail::after{visibility:hidden}
.tl .it.done .check{background:var(--good);border-color:var(--good);color:var(--bg)}
.tl .it.next .check{border-color:var(--accent);color:var(--accent)}
.tl .body{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;padding:5px 0 20px}
.tl .it.done .name{color:var(--muted);text-decoration:line-through}
.tl .it.next .body{background:var(--surface);border-radius:16px;padding:14px 16px 16px;margin-bottom:16px;gap:4px}
.tl .it.next .name{font-family:var(--display);font-weight:700;font-size:20px}
.tl .meta{margin-top:0}

.app.tela-ex{padding-bottom:0}
.count{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.segs{display:flex;gap:4px;margin-top:-8px}
.segs i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.segs i.ok{background:var(--good)}
.segs i.cur{background:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface);color:var(--muted)}
.fig.big{background:var(--surface);border-radius:18px;padding:16px 14px 12px;margin-top:4px}
.fig.big .fb .nt{fill:var(--surface)}
.passos{list-style:none;margin:6px 0 0;padding:0;counter-reset:p;display:flex;flex-direction:column;gap:14px}
.passos li{counter-increment:p;display:flex;gap:14px;font-size:16px;line-height:1.4}
.passos li::before{content:counter(p);flex:none;width:22px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--accent);line-height:1.2}
.dock{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;padding:28px 0 18px;background:linear-gradient(to bottom,transparent,var(--bg) 38%)}
.vid{flex:none;width:68px;height:64px;border-radius:20px;background:var(--surface);color:var(--ink);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600}
.vid svg{width:22px;height:22px;color:var(--accent)}
.feito{flex:1;min-width:0;height:64px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:12px;padding:0 20px;text-align:left}
.feito>svg{flex:none;width:26px;height:26px}
.feito span{min-width:0;display:flex;flex-direction:column}
.feito b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15}
.feito small{font-size:13px;font-weight:500;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feito.off{background:var(--surface);color:var(--ink);flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.feito:active{transform:scale(.98)}

:root{--bad:#F0907F}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.field label,.rowsel>label:not(.btn){font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.4}
input::placeholder{color:var(--muted);opacity:.7}
.oculto{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.duo{display:flex;gap:10px}
.duo .field:first-child{flex:0 0 96px}
.sec{font-family:var(--display);font-weight:700;font-size:19px;margin:14px 0 0}
.rowsel{display:flex;align-items:center;gap:10px}
.rowsel>label:not(.btn){flex:none;width:76px}
.rowsel select{flex:1}
.add{padding:14px;border-radius:14px;border:1.5px dashed var(--line);color:var(--accent);font-weight:600;text-align:center}
.danger{align-self:flex-start;margin-top:18px;padding:8px 0;color:var(--bad);font-weight:600;font-size:14px}
.ordem{display:flex;align-items:center;gap:6px}
.ordem .on{flex:1;min-width:0;text-align:left;background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:10px;font-weight:600}
.ordem .n{color:var(--muted);font-variant-numeric:tabular-nums}
.mini{flex:none;width:38px;height:42px;border-radius:10px;background:var(--surface);color:var(--muted);font-weight:700}
.mini:disabled{opacity:.3}
.foto img{display:block;width:100%;border-radius:18px}
.player{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.aviso{margin:0;color:var(--bad);font-size:14px;font-weight:600}
.tile.nova{background:transparent;border:1.5px dashed var(--line)}
.tile .letra{flex:1;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:64px;color:var(--muted)}
.empty .btn{align-self:flex-start;margin-top:8px}
button.vid{cursor:pointer}

.acts{display:flex;align-items:center;gap:8px}
.tile{position:relative}
.badge{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.badge svg{width:16px;height:16px;flex:none}
.ordem .on{align-items:center}
.ordem .grow{flex:1;min-width:0}
.ordem .on .n{font-weight:500;font-size:13px}
.mini{display:grid;place-items:center}
.mini svg{width:18px;height:18px}
.mini.sure{width:auto;padding:0 12px;background:var(--bad);color:var(--bg);font-size:13px}
.danger{align-self:stretch;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;padding:13px;border:1.5px solid var(--bad);border-radius:14px}
.danger svg{width:18px;height:18px}
.danger.sure{background:var(--bad);color:var(--bg)}

.dup{align-self:stretch;margin-top:10px}
.aviso.ok{color:var(--good)}
.toast{position:fixed;left:16px;right:16px;bottom:16px;max-width:488px;margin:0 auto;z-index:5;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;font-size:14px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;padding:10px 12px;border-radius:10px;font-weight:700;color:var(--bg)}
.toast button[data-undo]{background:var(--accent);color:var(--accent-ink)}

.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools:empty{display:none}
.tools .grupo{display:flex;gap:8px}
.tool{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 16px 0 12px;border-radius:14px;background:var(--surface);font-family:var(--display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.tool svg{width:20px;height:20px;color:var(--accent)}
.tool.sm{width:48px;padding:0;justify-content:center;color:var(--muted)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool.on svg{color:var(--accent-ink)}
.tool.fim{background:var(--good);color:var(--bg)}
.tool.fim svg{color:var(--bg)}
.nota{margin-top:8px}
.nota textarea{background:transparent}

.sets{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sets:empty{display:none}
.sets-h{display:flex;flex-direction:column;gap:2px;margin-bottom:2px}
.sets-h b{font-family:var(--display);font-size:17px}
.sets-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.set{display:flex;align-items:center;gap:8px}
.set .sn{flex:none;width:18px;font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.set input{flex:1;min-width:0;background:var(--bg);text-align:center;padding:10px 6px;font-weight:600;font-variant-numeric:tabular-nums}
.set .un{flex:none;font-size:13px;color:var(--muted)}
.setok{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);color:var(--muted);font-weight:700;font-size:18px}
.set.ok .setok{background:var(--good);border-color:var(--good);color:var(--bg)}
.set.ok input{opacity:.65}
.addset{align-self:flex-start;padding:6px 0;font-size:14px;font-weight:600;color:var(--accent)}
.rest{display:flex;align-items:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 8px 8px 14px;font-weight:600}
.rest b{flex:1;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.rest button{padding:8px 12px;border-radius:10px;background:var(--accent-ink);color:var(--accent);font-weight:700;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats div{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:34px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.mes b{font-family:var(--display);font-size:18px;text-transform:capitalize}
.mes .icon{font-size:22px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cw{text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.cd{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;border:2px solid transparent}
.cd.part{border-color:var(--good)}
.cd.full{background:var(--good);color:var(--bg)}
.cd.hoje:not(.full){color:var(--accent)}
.cd.sel{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ---------- DADOS (espelham as tabelas do banco) ---------- */
const categorias = [
  { id: 'musica', nome: 'Música' },
  { id: 'musculacao', nome: 'Musculação' }
];

const JANELAS = { 1:[5,8], 2:[7,10], 3:[9,13], 4:[12,15], 5:[14,17] }; // casas de cada shape em Lá menor
const yt = q => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);

const exercicios = {

// reduz a foto antes de guardar, para caber no armazenamento do aparelho
function lerFoto(file, cb) {
  const r = new FileReader();
  r.onerror = () => cb(null);
  r.onload = () => {
    const im = new Image();
    im.onerror = () => cb(null);
    im.onload = () => {
      const k = Math.min(1, 900 / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}

const CORDAS = [['e',4],['B',11],['G',7],['D',2],['A',9],['E',4]]; // de cima (aguda) para baixo (grave)
const PENTA = { 9:'A', 0:'C', 2:'D', 4:'E', 7:'G' };
const MARCAS = [3,5,7,9,12,15,17];

function braco(lo, hi) {
  const n = hi - lo + 1, w = n <= 6 ? 52 : 42, h = 30, x0 = 26, y0 = 8;
  const W = x0 + n*w + 8, H = y0 + 6*h + 26;
  let s = `<svg class="fb" ${n <= 6 ? 'style="width:100%;height:auto"' : `width="${W}" height="${H}"`} viewBox="0 0 ${W} ${H}" role="img" aria-label="Braço da guitarra, casas ${lo} a ${hi}, com as notas da pentatônica de Lá menor">`;
  for (let k = 0; k <= n; k++) s += `<line class="fret" x1="${x0+k*w}" y1="${y0+h/2}" x2="${x0+k*w}" y2="${y0+5.5*h}"/>`;
  CORDAS.forEach(([nome], i) => {
    const y = y0 + i*h + h/2;
    s += `<line class="str" x1="${x0}" y1="${y}" x2="${x0+n*w}" y2="${y}"/><text class="lbl" x="6" y="${y+4}">${nome}</text>`;
  });
  for (let k = 0; k < n; k++) {
    const f = lo + k, cx = x0 + k*w + w/2, m = MARCAS.includes(f);
    s += `<text class="num${m?' in':''}" x="${cx}" y="${H-6}" text-anchor="middle">${f}</text>`;
    if (m) s += `<circle class="inlay" cx="${cx}" cy="${H-22}" r="2.5"/>`;
    CORDAS.forEach(([, solta], i) => {
      const pc = (solta + f) % 12;
      if (!(pc in PENTA)) return;
      const cy = y0 + i*h + h/2, r = pc === 9 ? ' root' : '';
      s += `<circle class="note${r}" cx="${cx}" cy="${cy}" r="11"/><text class="nt${r}" x="${cx}" y="${cy+4}" text-anchor="middle">${PENTA[pc]}</text>`;
    });
  }
  return s + '</svg><div class="legend"><span><i class="r"></i>Tônica</span></div>';
}

function tab(seg) {
  const vazio = '-'.repeat(seg.length);
  // a corda grave (E) toca primeiro; na tablatura ela fica na linha de baixo
  const linhas = CORDAS.map(([nome], i) => {
    let l = nome + '|-';
    for (let p = 0; p < 6; p++) l += (5 - i === p) ? seg : vazio;
    return l + '|';
  });
  return `<pre aria-label="Tablatura do exercício">${linhas.join('\n')}</pre>`;
}

    else if (e.video && !ehImagem(e.video)) h += `<a class="vid" href="${esc(e.video)}" target="_blank" rel="noopener">${play}Vídeo</a>`;
    else h += `<a class="vid" href="${yt(e.busca || e.nome)}" target="_blank" rel="noopener">${play}${e.rotulo ? 'Base' : 'Buscar'}</a>`;
    h += done

  }

  else if (state.tela === 'gerir') {
    const rs = rotDaCat(state.cat), es = exDaCat(state.cat);
    h += voltar('Voltar') + `<h1 class="brand">Editar ${esc(cat.nome)}</h1><div class="form">`;
    h += `<div class="field"><label for="catNome">Nome da categoria</label><input id="catNome" data-f="catNome" value="${esc(cat.nome)}"></div>`;
    h += `<h2 class="sec">Rotinas</h2>`;
    rs.forEach(r => h += `<div class="ordem"><button class="on" data-editr="${r}"><span class="grow">${esc(rotinas[r].nome)}</span><span class="n">${idsDe(r).length} exerc.</span></button>${apagarItem('rot:' + r, rotinas[r].nome)}</div>`);
    h += `<button class="add" data-novar="1">+ Nova rotina</button>`;
    if (rs.length) {
      h += `<h2 class="sec">Semana</h2>`;
      DIAS.forEach(([d]) => h += `<div class="rowsel"><label for="ag${d}">${NOMES[d]}</label><select id="ag${d}" data-agenda="${d}"><option value="">Livre</option>${rs.map(r => `<option value="${r}"${ag[d] === r ? ' selected' : ''}>${esc(rotinas[r].nome)}</option>`).join('')}</select></div>`);
    }
    h += `<h2 class="sec">Exercícios</h2>`;
    es.forEach(x => h += `<div class="ordem"><button class="on" data-edite="${x}"><span class="grow">${esc(exercicios[x].nome)}</span></button>${apagarItem('ex:' + x, exercicios[x].nome)}</div>`);
    h += `<button class="add" data-novoe="1">+ Novo exercício</button>`;
    h += excluir('cat', 'Excluir categoria') + `</div>`;
  }

  else if (state.tela === 'editRotina') {
    const r = rotinas[state.editR], lista = idsDe(state.editR), es = exDaCat(r.categoria);
    h += voltar('Voltar') + `<h1 class="brand">Editar rotina</h1><div class="form">`;
    h += `<div class="field"><label for="rotNome">Nome</label><input id="rotNome" data-f="rotNome" value="${esc(r.nome)}"></div>`;

  }

  else if (state.tela === 'editEx') {
    const e = exercicios[state.editE];
    h += voltar('Voltar') + `<h1 class="brand">Editar exercício</h1><div class="form">`;

    h += `<div class="field"><label for="exPassos">Como fazer (um passo por linha)</label><textarea id="exPassos" data-f="exPassos" rows="5">${esc((e.passos || []).join('\n'))}</textarea></div>`;

    h += `<div class="field"><label for="exFoto">Foto de referência</label>`;
    if (e.imagem) h += `<div class="foto"><img src="${e.imagem}" alt="Foto atual"></div>`;
    h += `<div class="rowsel"><label class="btn ghost grow" for="exFoto">${e.imagem ? 'Trocar foto' : 'Escolher foto'}</label>${e.imagem ? '<button class="btn ghost" data-delfoto="1">Remover</button>' : ''}</div><input id="exFoto" type="file" accept="image/*" class="oculto"></div>`;
    if (state.aviso) h += `<p class="aviso">${esc(state.aviso)}</p>`;
    h += `<button class="btn ghost dup" data-duplicar="ex">Duplicar exercício</button>` + excluir('ex', 'Excluir exercício') + `</div>`;

  if (state.undo) h += `<div class="toast" role="status"><span>${esc(state.undo.txt)}</span><button data-undo="1">Desfazer</button><button data-fechatoast="1" aria-label="Fechar aviso">✕</button></div>`;
  app.className = 'app' + (state.tela === 'exercicio' ? ' tela-ex' : '');
  app.innerHTML = h;
  try { document.body.style.zoom = config.textoGrande ? '1.15' : ''; } catch (e) {}
  telaLigada(emTreino());
}

// guarda uma cópia dos dados antes de apagar; o aviso com "Desfazer" some sozinho
let undoTimer = null;
function guardarDesfazer(txt) {
  state.undo = { snap: foto(), txt };
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    state.undo = null;
    const el = document.querySelector && document.querySelector('.toast');
    if (el) el.remove();
  }, 9000);
}
function apagarEx(id) {
  delete exercicios[id];
  for (const r in rotina_exercicios) rotina_exercicios[r] = rotina_exercicios[r].filter(x => x !== id);
}
function apagarRot(id) {
  delete rotinas[id]; delete rotina_exercicios[id];
  for (const c in agenda) for (const dia in agenda[c]) if (agenda[c][dia] === id) agenda[c][dia] = null;
}

/* ---------- FERRAMENTAS DO TREINO ---------- */
const playIc = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>';
const pausaIc = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';
const fmt = seg => String(Math.floor(seg / 60)).padStart(2, '0') + ':' + String(seg % 60).padStart(2, '0');
const bpmDe = txt => { const m = String(txt || '').match(/(\d{2,3})\s*(?:[–-]\s*\d{2,3}\s*)?bpm/i); return m ? +m[1] : 0; };

// cronômetro: guarda a hora em que termina, para não atrasar com a tela apagada
let T = { ex:null, total:0, restante:0, fim:null };
const restanteAgora = () => T.fim ? Math.max(0, Math.ceil((T.fim - Date.now()) / 1000)) : T.restante;

// metrônomo: os cliques são agendados no relógio do áudio, que é preciso
let ac = null;
const metro = { on:false, bpm:0, prox:0, timer:null };
function audio() {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; }
  return ac;
}
function bip(t, freq, dur, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function iniciarMetro() {
  if (!audio()) return;
  metro.on = true; metro.prox = ac.currentTime + 0.06;
  clearInterval(metro.timer);
  metro.timer = setInterval(() => { while (metro.prox < ac.currentTime + 0.15) { bip(metro.prox, 1000, 0.05, 0.5); metro.prox += 60 / metro.bpm; } }, 25);
}
function pararMetro() { metro.on = false; clearInterval(metro.timer); }
function alarme() {
  try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch (e) {}
  try { if (audio()) [0, 0.25, 0.5].forEach(d => bip(ac.currentTime + 0.05 + d, 880, 0.15, 0.4)); } catch (e) {}
}
function prepararEx() {
  if (T.ex === state.ex) return;
  const e = exercicios[state.ex], seg = (+e.min || 0) * 60;
  T = { ex: state.ex, total: seg, restante: seg, fim: null };
  pararMetro(); R.fim = null;
  metro.bpm = e.bpmUlt || bpmDe(e.bpm) || 0;
}
function toolsHTML() {
  let h = '';
  if (T.total > 0) {
    const run = !!T.fim;
    h += `<button class="tool${run ? ' on' : ''}${!run && T.restante === 0 ? ' fim' : ''}" data-timer="1" aria-label="${run ? 'Pausar' : 'Iniciar'} cronômetro">${run ? pausaIc : playIc}<span id="tmr">${fmt(restanteAgora())}</span></button>`;
    if (run || T.restante !== T.total) h += `<button class="tool sm" data-timerreset="1" aria-label="Zerar cronômetro">↺</button>`;
  }
  if (metro.bpm) {
    h += `<span class="grupo"><button class="tool${metro.on ? ' on' : ''}" data-metro="1" aria-label="${metro.on ? 'Parar' : 'Tocar'} metrônomo">${metro.on ? pausaIc : playIc}<span>${metro.bpm} bpm</span></button>`;
    h += `<button class="tool sm" data-bpm="-5" aria-label="Diminuir 5 bpm">−</button><button class="tool sm" data-bpm="5" aria-label="Aumentar 5 bpm">+</button></span>`;
  }
  return h;
}
function atualizarTools() { const el = document.getElementById('tools'); if (el) el.innerHTML = toolsHTML(); }
setInterval(() => {
  if (!T.fim) return;
  const r = restanteAgora(), el = document.getElementById('tmr');
  if (el) el.textContent = fmt(r);
  if (r <= 0) { T.fim = null; T.restante = 0; alarme(); atualizarTools(); }
}, 400);

// séries: quantas o exercício pede (campo próprio ou lido de um detalhe como "3x12")
const seriesDe = e => {
  if (e.series !== undefined && e.series !== null && e.series !== '') return Math.min(12, Math.max(0, +e.series || 0));
  const m = /(\d+)\s*[x×]\s*\d+/i.exec(e.bpm || '');
  return m ? Math.min(12, +m[1]) : 0;
};
const repsDe = e => { const m = /\d+\s*[x×]\s*(\d+)/i.exec(e.bpm || ''); return m ? m[1] : ''; };
function setsDe(exId, criar) {
  const k = chaveDe(state.dia);
  if (!state.log[exId]) { if (!criar) return []; state.log[exId] = {}; }
  if (!state.log[exId][k]) { if (!criar) return []; state.log[exId][k] = []; }
  return state.log[exId][k];
}
function setEm(i) { const a = setsDe(state.ex, true); while (a.length <= i) a.push({ c:'', r:'', ok:false }); return a[i]; }
function ultimaVez(exId) {
  const k = chaveDe(state.dia), porEx = state.log[exId] || {};
  const d = Object.keys(porEx).filter(x => x < k && porEx[x].some(t => t.ok)).sort().pop();
  return d ? { data: d, sets: porEx[d].filter(t => t.ok) } : null;
}
// descanso entre séries
const R = { fim: null };
const restAgora = () => R.fim ? Math.max(0, Math.ceil((R.fim - Date.now()) / 1000)) : 0;
function setsHTML() {
  const e = exercicios[state.ex];
  if (!e) return '';
  const feitas = setsDe(state.ex), n = Math.max(seriesDe(e), feitas.length);
  if (!n) return '';
  const ant = ultimaVez(state.ex), reps = repsDe(e);
  let h = `<div class="sets-h"><b>Séries</b>${ant ? `<span>Última vez, ${+ant.data.slice(8)} ${MESES[+ant.data.slice(5, 7) - 1]}: ${ant.sets.map(t => esc((t.c !== '' ? t.c + ' kg × ' : '') + t.r)).join(' · ')}</span>` : ''}</div>`;
  for (let i = 0; i < n; i++) {
    const t = feitas[i] || { c:'', r:'', ok:false };
    const p = (ant && (ant.sets[i] || ant.sets[ant.sets.length - 1])) || {};
    h += `<div class="set${t.ok ? ' ok' : ''}"><span class="sn">${i + 1}</span>`;
    h += `<input type="number" inputmode="decimal" step="any" aria-label="Carga da série ${i + 1}, em kg" data-set="${i}" data-k="c" placeholder="${esc(p.c ?? '')}" value="${esc(t.c)}"><span class="un">kg ×</span>`;
    h += `<input type="number" inputmode="numeric" aria-label="Repetições da série ${i + 1}" data-set="${i}" data-k="r" placeholder="${esc(p.r || reps)}" value="${esc(t.r)}">`;
    h += `<button class="setok" data-setok="${i}" aria-pressed="${!!t.ok}" aria-label="Série ${i + 1} feita">✓</button></div>`;
  }
  h += `<button class="addset" data-addset="1">+ série</button>`;
  if (R.fim) h += `<div class="rest"><span>Descanso</span><b id="restv">${fmt(restAgora())}</b><button data-restskip="1">Pular</button></div>`;
  return h;
}
function atualizarSets() { const el = document.getElementById('sets'); if (el) el.innerHTML = setsHTML(); }
setInterval(() => {
  if (!R.fim) return;
  const r = restAgora(), el = document.getElementById('restv');
  if (el) el.textContent = fmt(r);
  if (r <= 0) { R.fim = null; alarme(); atualizarSets(); }
}, 400);

// histórico: 0 = sem treino, 1 = treino parcial, 2 = treino completo
function diaTreinado(k) {
  const d = state.feitos[k];
  if (!d) return 0;
  let algum = false, completo = true;
  for (const r in d) {
    if (!d[r].length) continue;
    algum = true;
    if (rotinas[r] && d[r].filter(x => exercicios[x]).length < idsDe(r).length) completo = false;
  }
  return algum ? (completo ? 2 : 1) : 0;
}
// sequência: treinos seguidos sem faltar em dia que tinha rotina marcada (dias livres não quebram)
function sequencia() {
  let n = 0;
  const dt = new Date();
  for (let i = 0; i < 400; i++) {
    const agendado = Object.values(agenda).some(a => a && rotinas[a[dt.getDay()]]);
    if (diaTreinado(chaveData(dt))) n++;
    else if (agendado && i > 0) break;
    dt.setDate(dt.getDate() - 1);
  }
  return n;
}

// tela ligada durante o treino
let trava = null;
async function telaLigada(on) {
  try {
    if (on && !trava && navigator.wakeLock) { trava = await navigator.wakeLock.request('screen'); trava.addEventListener('release', () => { trava = null; }); }
    else if (!on && trava) { const t = trava; trava = null; await t.release(); }
  } catch (e) { trava = null; }
}
const emTreino = () => config.telaLigada && (state.tela === 'rotina' || state.tela === 'exercicio');

// botão voltar do Android: mantém uma entrada extra no histórico enquanto não se está no Início
let armadilha = false, ignorarPop = false;
const alvoVoltar = () => ({ config:'inicio', semana:'inicio', rotina: config.diaAtual ? 'inicio' : 'semana', exercicio:'rotina', gerir: state.voltaGerir, editRotina: state.voltaRot, editEx: state.voltaEx, historico:'inicio' }[state.tela] || 'inicio');

function ir(tela) {
  state.tela = tela; state.confirma = null; state.player = false; state.aviso = ''; state.colando = false;
  if (tela !== 'exercicio') { T.ex = null; T.fim = null; R.fim = null; pararMetro(); }
  try {
    if (tela !== 'inicio' && !armadilha) { history.pushState({ pg: 1 }, ''); armadilha = true; }
    else if (tela === 'inicio' && armadilha) { armadilha = false; ignorarPop = true; history.back(); }
  } catch (e) {}
  try { window.scrollTo(0, 0); } catch (e) {}
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  const ag = agenda[state.cat] || {};
  const rid = rotinas[ag[state.dia]] ? ag[state.dia] : null;
  const marcar = id => {
    const f = feitosDe(rid, true), i = f.indexOf(id);
    if (i >= 0) { f.splice(i, 1); salvar(); return false; }
    f.push(id); salvar(); return true;
  };
  const lista = rotina_exercicios[state.editR];
  if (d.timer || d.timerreset || d.metro || d.bpm) {
    if (d.timer) {
      if (T.fim) { T.restante = restanteAgora(); T.fim = null; }
      else { if (T.restante <= 0) T.restante = T.total; T.fim = Date.now() + T.restante * 1000; audio(); }
    }
    else if (d.timerreset) { T.fim = null; T.restante = T.total; }
    else if (d.metro) { if (metro.on) pararMetro(); else iniciarMetro(); }
    else if (d.bpm) {
      metro.bpm = Math.min(240, Math.max(30, metro.bpm + (+d.bpm)));
      if (exercicios[state.ex]) { exercicios[state.ex].bpmUlt = metro.bpm; salvarDados(); }
    }
    atualizarTools();
    return;
  }
  if (d.setok !== undefined || d.addset || d.restskip) {
    const e = exercicios[state.ex];
    if (d.setok !== undefined) {
      const i = +d.setok, t = setEm(i);
      if (t.ok) t.ok = false;
      else {
        const ant = ultimaVez(state.ex), p = (ant && (ant.sets[i] || ant.sets[ant.sets.length - 1])) || {};
        if (t.c === '') t.c = p.c ?? '';
        if (t.r === '') t.r = p.r || repsDe(e) || '';
        t.ok = true;
        const a = setsDe(state.ex), n = Math.max(seriesDe(e), a.length);
        if (a.filter(x => x.ok).length < n) { R.fim = Date.now() + (+e.descanso || 60) * 1000; audio(); } else R.fim = null;
      }
    }
    else if (d.addset) setEm(Math.max(seriesDe(e), setsDe(state.ex).length));
    else R.fim = null;
    salvarLog(); atualizarSets();
    return;
  }
  if (!d.del && !d.delitem) state.confirma = null;

  if (d.back) ir(alvoVoltar());
  else if (d.config) ir('config');
  else if (d.hist) { const n = new Date(); state.mes = { y: n.getFullYear(), m: n.getMonth() }; state.histDia = chaveData(n); ir('historico'); }
  else if (d.mesnav) { const n = new Date(state.mes.y, state.mes.m + (+d.mesnav), 1); state.mes = { y: n.getFullYear(), m: n.getMonth() }; state.histDia = null; }
  else if (d.hd) state.histDia = d.hd;
  else if (d.toggle) { config[d.toggle] = !config[d.toggle]; salvarConfig(); }
  else if (d.modoedit) state.editando = !state.editando;
  else if (d.cat) {
    state.cat = d.cat; state.dia = hoje;
    if (state.editando) { state.voltaGerir = 'inicio'; ir('gerir'); }
    else ir(config.diaAtual ? 'rotina' : 'semana');
  }
  else if (d.semana) ir('semana');
  else if (d.dia !== undefined) { state.dia = +d.dia; ir('rotina'); }
  else if (d.ex) { state.ex = d.ex; ir('exercicio'); }
  else if (d.check) marcar(d.check);
  else if (d.player) state.player = !state.player;
  else if (d.feito) {
    if (marcar(state.ex)) {
      const ids = idsDe(rid), f = feitosDe(rid), ix = ids.indexOf(state.ex);
      const prox = ids.slice(ix + 1).find(id => !f.includes(id)) || ids.find(id => !f.includes(id));
      if (prox) { state.ex = prox; ir('exercicio'); } else ir('rotina');
    }
  }
  else if (d.reset) { feitosDe(rid, true).length = 0; salvar(); }

  // ----- edição
  else if (d.gerir) { state.voltaGerir = state.tela; ir('gerir'); }
  else if (d.novacat) {
    const id = novoId();
    categorias.push({ id, nome:'Nova categoria' }); agenda[id] = {};
    state.cat = id; state.voltaGerir = 'inicio'; salvarDados(); ir('gerir');
  }
  else if (d.editr) { state.editR = d.editr; state.voltaRot = state.tela; ir('editRotina'); }
  else if (d.novar) {
    const id = novoId();
    rotinas[id] = { categoria: state.cat, nome:'Nova rotina' }; rotina_exercicios[id] = [];
    state.editR = id; state.voltaRot = 'gerir'; salvarDados(); ir('editRotina');
  }
  else if (d.edite) { state.editE = d.edite; state.voltaEx = state.tela; ir('editEx'); }
  else if (d.novoe) {
    const id = novoId();
    exercicios[id] = { nome:'Novo exercício', min:5, passos:[], cat: state.cat };
    if (state.tela === 'editRotina') lista.push(id);
    state.editE = id; state.voltaEx = state.tela; salvarDados(); ir('editEx');
  }
  else if (d.colarabrir) state.colando = !state.colando;
  else if (d.colar) {
    const campo = document.getElementById('colaTxt'), cat = rotinas[state.editR].categoria;
    String((campo && campo.value) || '').split('\n').forEach(linha => {
      const partes = linha.split(/\s+[-–—]\s+|;\s*|\t+/).map(x => x.trim()).filter(Boolean);
      if (!partes.length) return;
      const nome = partes[0], det = partes.slice(1).join(' · ');
      let id = exDaCat(cat).find(x => exercicios[x].nome.toLowerCase() === nome.toLowerCase());
      if (!id) { id = novoId(); exercicios[id] = { nome, min: 5, bpm: det, passos: [], cat }; }
      lista.push(id);
    });
    state.colando = false; salvarDados();
  }
  else if (d.sobe) { const i = +d.sobe; [lista[i - 1], lista[i]] = [lista[i], lista[i - 1]]; salvarDados(); }
  else if (d.desce) { const i = +d.desce; [lista[i + 1], lista[i]] = [lista[i], lista[i + 1]]; salvarDados(); }
  else if (d.tira) { lista.splice(+d.tira, 1); salvarDados(); }
  else if (d.addex) { const sel = document.getElementById('addSel'); if (sel && exercicios[sel.value]) { lista.push(sel.value); salvarDados(); } }
  else if (d.delfoto) { delete exercicios[state.editE].imagem; salvarDados(); }
  else if (d.undo) {
    if (state.undo) { aplicarDados(JSON.parse(state.undo.snap)); salvarDados(); state.undo = null; clearTimeout(undoTimer); }
    if (!categorias.some(c => c.id === state.cat) || (state.tela === 'editRotina' && !rotinas[state.editR]) || (state.tela === 'editEx' && !exercicios[state.editE])) ir('inicio');
  }
  else if (d.fechatoast) { state.undo = null; clearTimeout(undoTimer); }
  else if (d.duplicar === 'ex') {
    const id = novoId(), o = exercicios[state.editE];
    exercicios[id] = JSON.parse(JSON.stringify(o)); exercicios[id].nome = o.nome + ' (cópia)';
    if (state.voltaEx === 'editRotina' && rotina_exercicios[state.editR]) rotina_exercicios[state.editR].push(id);
    state.editE = id; salvarDados(); ir('editEx');
  }
  else if (d.duplicar === 'rot') {
    const id = novoId(), o = rotinas[state.editR];
    rotinas[id] = { categoria: o.categoria, nome: o.nome + ' (cópia)' };
    rotina_exercicios[id] = idsDe(state.editR).slice();
    state.editR = id; salvarDados(); ir('editRotina');
  }
  else if (d.exportar) {
    try {
      const blob = new Blob([JSON.stringify({ app:'pratica-guiada', versao:1, dados: JSON.parse(foto()), feitos: state.feitos, log: state.log, config }, null, 1)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'pratica-guiada-' + chaveDe(hoje) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      state.aviso = 'Arquivo gerado. Procure na pasta de downloads.';
    } catch (e) { state.aviso = 'Não consegui gerar o arquivo neste navegador.'; }
  }
  else if (d.delitem) {
    if (state.confirma !== d.delitem) state.confirma = d.delitem;
    else {
      const [tipo, id] = d.delitem.split(':');
      guardarDesfazer(`"${(tipo === 'ex' ? exercicios : rotinas)[id].nome}" apagado`);
      if (tipo === 'ex') apagarEx(id); else apagarRot(id);
      state.confirma = null; salvarDados();
    }
  }
  else if (d.del) {
    if (state.confirma !== d.del) state.confirma = d.del;
    else {
      guardarDesfazer(`"${d.del === 'ex' ? exercicios[state.editE].nome : d.del === 'rot' ? rotinas[state.editR].nome : categorias.find(c => c.id === state.cat).nome}" apagado`);
      if (d.del === 'ex') { apagarEx(state.editE); ir(state.voltaEx === 'exercicio' ? 'rotina' : state.voltaEx); }
      else if (d.del === 'rot') { apagarRot(state.editR); ir(state.voltaRot); }
      else if (d.del === 'cat') {
        const id = state.cat;
        rotDaCat(id).forEach(apagarRot);
        exDaCat(id).forEach(apagarEx);
        delete agenda[id];
        categorias.splice(categorias.findIndex(c => c.id === id), 1);
        ir('inicio');
      }
      salvarDados();
    }
  }
  else return;
  render();
});

// campos de edição gravam sozinhos ao sair do campo
app.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset || {}, v = String(t.value ?? '').trim();
  const e = exercicios[state.editE];
  if (t.id === 'impArq') {
    const file = t.files && t.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onerror = () => { state.aviso = 'Não consegui ler o arquivo.'; render(); };
    r.onload = () => {
      try {
        const o = JSON.parse(r.result), d = o.dados || o;
        if (!dadosValidos(d)) throw 0;
        guardarDesfazer('Dados importados');
        aplicarDados(d);
        if (o.feitos && typeof o.feitos === 'object') { Object.assign(state.feitos, o.feitos); salvar(); }
        if (o.log && typeof o.log === 'object') { Object.assign(state.log, o.log); salvarLog(); }
        state.aviso = salvarDados() ? '' : 'Importado, mas sem espaço para guardar no aparelho.';
      } catch (e) { state.aviso = 'Este arquivo não é uma cópia do Prática Guiada.'; }
      render();
    };
    r.readAsText(file);
    return;
  }
  if (t.type === 'file') {
    const file = t.files && t.files[0];
    if (!file) return;
    lerFoto(file, url => {
      if (!url) state.aviso = 'Não consegui ler essa imagem.';
      else {
        const antes = e.imagem; e.imagem = url; state.aviso = '';
        if (!salvarDados()) { if (antes) e.imagem = antes; else delete e.imagem; state.aviso = 'Sem espaço no aparelho para guardar mais uma foto. Use um link no campo acima.'; }
      }
      render();
    });
    return;
  }
  if (d.set !== undefined) { setEm(+d.set)[d.k] = v; salvarLog(); return; }
  if (d.f === 'exNota') { if (exercicios[state.ex]) { exercicios[state.ex].nota = v; salvarDados(); } return; }
  if (d.agenda !== undefined) { (agenda[state.cat] || (agenda[state.cat] = {}))[d.agenda] = v || null; }
  else if (d.f === 'catNome') { if (v) categorias.find(c => c.id === state.cat).nome = v; }
  else if (d.f === 'rotNome') { if (v) rotinas[state.editR].nome = v; }
  else if (d.f === 'exNome') { if (v) e.nome = v; }
  else if (d.f === 'exMin') e.min = Math.max(0, Math.round(+v || 0));
  else if (d.f === 'exDet') e.bpm = v;
  else if (d.f === 'exSeries') { if (v === '') delete e.series; else e.series = Math.min(12, Math.max(0, Math.round(+v || 0))); }
  else if (d.f === 'exDesc') e.descanso = Math.max(5, Math.round(+v || 60));
  else if (d.f === 'exPassos') e.passos = v.split('\n').map(x => x.trim()).filter(Boolean);
  else if (d.f === 'exVideo') e.video = v;
  else return;
  salvarDados();
});

render();

if (window.addEventListener) {
  window.addEventListener('popstate', () => {
    if (ignorarPop) { ignorarPop = false; return; }
    armadilha = false;
    if (state.tela !== 'inicio') { ir(alvoVoltar()); render(); }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') telaLigada(emTreino()); });
}

// funciona offline depois da primeira visita
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
